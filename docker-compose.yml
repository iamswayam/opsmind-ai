version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: opsmind-db
    environment:
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: opsmind
    ports:
      - "5433:5432"
    volumes:
      - opsmind_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build: .
    container_name: opsmind-api
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:devpass@db:5432/opsmind}
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./app:/app/app   # live-reload your code without rebuilding the image

volumes:
  opsmind_pgdata:
